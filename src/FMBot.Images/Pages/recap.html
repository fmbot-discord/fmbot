<html>

<head>
    <style>
        @font-face {
            font-family: "worksans";
            src: url("https://fm.bot/fonts/worksans-regular.otf") format("opentype");
        }

        @font-face {
            font-family: "worksans";
            font-weight: 600;
            src: url("https://fm.bot/fonts/worksans-semibold.ttf") format("truetype");
        }

        html, body {
            margin: 0;
        }

        body {
            font-family: "worksans", sans-serif;
            width: 800px;
            box-sizing: border-box;
            padding: 0 24px 20px 24px;
            color: #dcddde;
            font-variant-numeric: tabular-nums;
            background-color: #202225;
        }

        .muted {
            color: #b9bbbe;
        }

        .ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .label {
            font-size: 22px;
        }

        .chip {
            position: absolute;
            z-index: 2;
            max-width: 640px;
            background-color: #2f3136;
            border-radius: 6px;
            box-shadow: 0px 1px 4px rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            font-size: 22px;
            line-height: 26px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-chip {
            top: 28px;
            left: 24px;
        }

        .genre-chip {
            bottom: -21px;
            left: 50%;
            transform: translateX(-50%);
        }

        .photo {
            position: relative;
            height: 380px;
            margin: 0 -24px;
            overflow: hidden;
        }

        .photo-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 40%;
        }

        .photo::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
            background: linear-gradient(180deg, rgba(32, 34, 37, 0.1) 0%, rgba(32, 34, 37, 0.3) 38%, rgba(32, 34, 37, 0.92) 64%, #202225 80%);
        }

        .hero-text {
            position: absolute;
            z-index: 2;
            left: 24px;
            right: 24px;
            bottom: 16px;
        }

        .no-photo {
            height: auto;
            padding: 100px 0 16px 0;
        }

        .no-photo .photo-img, .no-photo::after {
            display: none;
        }

        .no-photo .hero-text {
            position: static;
            padding: 0 24px;
        }

        .hero-name {
            font-size: 44px;
            font-weight: 600;
            line-height: 1.15;
            margin-top: 2px;
        }

        .hero-line {
            font-size: 26px;
            margin-top: 6px;
        }

        .panel {
            position: relative;
            background-color: #2f3136;
            border-radius: 8px;
            box-shadow: 0px 1px 4px rgba(0, 0, 0, 0.6);
        }

        .main {
            margin-top: 16px;
            padding: 28px 28px 49px 28px;
        }

        .main:has(.genre-chip.hidden) {
            padding-bottom: 28px;
        }

        .section + .section {
            margin-top: 28px;
            padding-top: 28px;
            border-top: 1px solid rgba(220, 221, 222, 0.08);
        }

        .stats {
            display: flex;
            column-gap: 32px;
        }

        .stats > div {
            flex: 1 1 0;
            min-width: 0;
        }

        .lists {
            display: grid;
            column-gap: 32px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stat-num {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.2;
        }

        .compact .stat-num {
            font-size: 26px;
            line-height: 1.48;
        }

        .list .label {
            margin-bottom: 16px;
        }

        .list + .list {
            position: relative;
        }

        .list + .list::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: -16px;
            width: 1px;
            background-color: rgba(220, 221, 222, 0.08);
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        li {
            display: grid;
            grid-template-columns: 52px minmax(0, 1fr);
            column-gap: 12px;
            align-items: center;
            height: 60px;
        }

        li + li {
            margin-top: 14px;
        }

        .thumb {
            width: 52px;
            height: 52px;
            object-fit: cover;
        }

        .round {
            border-radius: 50%;
        }

        .square {
            border-radius: 8px;
        }

        .item-name {
            font-size: 26px;
            line-height: 1.15;
        }

        .item-sub {
            font-size: 22px;
            line-height: 1.2;
            margin-top: 1px;
        }

        .branding {
            margin-top: 32px;
            text-align: center;
            font-size: 22px;
            color: rgba(220, 221, 222, 0.4);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="photo {{photo-class}}">
        <img class="photo-img" src="{{photo-url}}">
        <div class="chip title-chip">{{title}}</div>
        <div class="hero-text">
            <div class="label muted ellipsis">{{top-artist-label}}</div>
            <div class="hero-name ellipsis">{{top-artist-name}}</div>
            <div class="hero-line ellipsis">{{top-artist-line}}</div>
        </div>
    </div>
    <div class="panel main">
        <div class="section stats {{stats-class}}">
            {{stats}}
        </div>
        <div class="section lists">
            <div class="list">
                <div class="label muted">{{top-artists-label}}</div>
                <ul>
                    {{artists}}
                </ul>
            </div>
            <div class="list">
                <div class="label muted">{{top-tracks-label}}</div>
                <ul>
                    {{tracks}}
                </ul>
            </div>
        </div>
        <div class="chip genre-chip {{genres-class}}">{{genres}}</div>
    </div>
    <div class="branding">Powered by .fmbot</div>
</body>

</html>
